name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .models
          key: whisper-models-v1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: AI log summary
        run: npm run -s ai-log:stats >> "$GITHUB_STEP_SUMMARY"
