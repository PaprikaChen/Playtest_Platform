name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .models
          key: whisper-models-v1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: AI log summary
        run: npm run -s ai-log:stats >> "$GITHUB_STEP_SUMMARY"

  e2e:
    # Full browser flow with a fake screen + fake mic (synthesized speech). Bundled Chromium in CI,
    # real Chrome locally (see playwright.config.ts).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .models
          key: whisper-models-v1
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            docs/screenshots/e2e-*.png
            test-results/
          retention-days: 7
